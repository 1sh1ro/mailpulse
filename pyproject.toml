[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailpulse"
version = "0.1.0"
description = "An open-source, serverless AI email filter and notifier."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MailPulse contributors" }]
dependencies = [
    "pydantic>=2.8",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mailpulse = "mailpulse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mailpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: 需要真实外部服务的集成测试"]
addopts = "-m 'not integration'"
